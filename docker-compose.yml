services:
  db:
    image: mysql:8.4
    container_name: payments-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-supersecret}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - "mysql_data:/var/lib/mysql"
    # Pings over TCP, so it only passes once MySQL accepts real connections (not during its first-run setup)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Only with `docker compose --profile app up --build`: plain `docker compose up -d` still starts just MySQL
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: Web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PaymentsDb: "server=db;port=3306;database=payments;user=root;password=${MYSQL_ROOT_PASSWORD:-supersecret}"
      Database__MigrateOnStartup: "true"
    ports:
      - "${API_HOST_PORT:-8080}:8080"

volumes:
  mysql_data:
